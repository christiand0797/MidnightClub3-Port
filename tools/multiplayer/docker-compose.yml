# MC3 Multiplayer — Docker Compose (Production)
# Deploys the relay server with persistent data volume

services:
  mc3-relay:
    build:
      context: .
      dockerfile: relay/Dockerfile
    container_name: mc3-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      - RELAY_PORT=8080
      - RELAY_HOST=0.0.0.0
      - NODE_ENV=production
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      - MAX_PLAYERS=8
      - GAME_TIMEOUT=3600
    volumes:
      - mc3-relay-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://127.0.0.1:8080/healthz',s=>{s.resume();process.exit(s.statusCode===200?0:1)});r.setTimeout(3000,()=>r.destroy());r.on('error',()=>process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  mc3-relay-data:
