<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MC3 Browser Multiplayer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #05050a;
    color: #e0e0e0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
  }

  /* ---------- Game view (fullscreen) ---------- */
  #gameContainer {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    cursor: crosshair;
  }
  #gameScreen {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    image-rendering: -webkit-optimize-contrast;
    filter: brightness(1.04) contrast(1.03) saturate(1.05);
  }
  #gameConnecting {
    color: #888;
    font-size: 1.25rem;
    letter-spacing: 1px;
    text-align: center;
    padding-top: 40vh;
  }

  /* ---------- HUD overlay ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .hud-top {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 24px;
  }
  .hud-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid rgba(0,212,255,0.35);
    font-size: 0.82rem;
  }
  .hud-pill.game { border-color: rgba(0,212,255,0.5); }
  .hud-pill.stream { border-color: rgba(255,170,68,0.5); }
  .indicator {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; flex-shrink: 0;
  }
  .indicator.online { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
  .indicator.streaming { background: #ffaa44; box-shadow: 0 0 10px #ffaa44; }
  .indicator.offline { background: #ff4444; box-shadow: 0 0 10px #ff4444; }
  .hud-label { color: #c9d1e2; font-weight: 600; }
  .hud-value { color: #e0e0e0; font-weight: 700; font-family: 'Consolas', monospace; }

  .hud-fps {
    font-family: 'Consolas', monospace;
    color: #00d4ff;
    font-size: 0.85rem;
  }

  /* ---------- Lobby ---------- */
  #lobby {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #101426 0%, #05050a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    pointer-events: auto;
  }
  #lobby.hidden { display: none !important; }
  .lobby-card {
    background: linear-gradient(145deg, #1a233a 0%, #0f172b 100%);
    border: 1px solid #00d4ff;
    border-radius: 16px;
    padding: 36px 32px;
    max-width: 460px;
    width: 90vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .lobby-card h1 {
    color: #00d4ff;
    margin-bottom: 6px;
    font-size: 1.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .lobby-card .subtitle {
    color: #8897b0;
    font-size: 0.85rem;
    margin-bottom: 24px;
  }
  .lobby-input {
    width: 100%;
    background: #080b14;
    border: 1px solid #2a3f5f;
    color: #e0e0e0;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 14px;
    outline: none;
    transition: border 0.2s;
  }
  .lobby-input:focus { border-color: #00d4ff; }
  .lobby-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .lobby-btn {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lobby-btn.primary { background: #00d4ff; color: #000; }
  .lobby-btn.primary:hover { background: #33e0ff; transform: translateY(-1px); }
  .lobby-btn.primary:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; }
  .lobby-btn.secondary { background: #1f2d44; color: #c9d1e2; border: 1px solid #2a3f5f; }
  .lobby-btn.secondary:hover { background: #2a3f5f; }

  .game-list {
    margin-top: 16px;
    max-height: 260px;
    overflow-y: auto;
    border: 1px solid #2a3f5f;
    border-radius: 10px;
    background: #080b14;
  }
  .game-item {
    background: #0c101e;
    border: 1px solid #2a3f5f;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
  }
  .game-item:hover { background: #16213e; border-color: #00d4ff; }
  .game-item.full { opacity: 0.55; }
  .game-item .gi-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .game-item .game-id { color: #00d4ff; font-weight: 800; font-size: 0.95rem; letter-spacing: 1px; }
  .game-item .game-info { color: #8897b0; font-size: 0.8rem; }
  .game-item .players {
    display: flex;
    gap: 5px;
    margin-top: 7px;
  }
  .player-badge {
    width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 800; color: #fff;
  }

  .lobby-footer {
    margin-top: 18px;
    color: #6a7a98;
    font-size: 0.78rem;
    text-align: center;
  }

  /* ---------- Controller hint ---------- */
  .ctrl-hint {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    color: #6a7a98;
    font-size: 0.8rem;
    pointer-events: none;
    letter-spacing: 0.5px;
  }
  .ctrl-hint kbd {
    background: #1f2d44;
    border: 1px solid #2a3f5f;
    border-radius: 5px;
    padding: 2px 7px;
    margin: 0 3px;
    font-family: 'Consolas', monospace;
    color: #00d4ff;
    font-size: 0.8rem;
  }

  /* ---------- Chat ---------- */
  #chat {
    position: absolute;
    bottom: 70px;
    right: 24px;
    width: 320px;
    height: 220px;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(8px);
    border: 1px solid #16213e;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    pointer-events: auto;
    z-index: 20;
  }
  #chat .chat-header {
    border-bottom: 1px solid #16213e;
    padding: 8px 12px;
    font-size: 0.78rem;
    color: #8897b0;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #chat .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    font-size: 0.8rem;
    font-family: 'Consolas', monospace;
  }
  #chat .chat-msg {
    margin-bottom: 6px;
    padding: 5px 8px;
    border-radius: 6px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  #chat .chat-msg.system { color: #8a9bb3; font-style: italic; }
  #chat .chat-msg.me { background: rgba(0,212,255,0.15); color: #7fd4ff; margin-left: auto; max-width: 75%; }
  #chat .chat-msg.other { background: rgba(255,255,255,0.06); color: #e0e0e0; }
  #chat .chat-input-wrap {
    border-top: 1px solid #16213e;
    display: flex;
    padding: 7px;
    gap: 7px;
  }
  #chat input {
    flex: 1;
    background: #080b14;
    border: 1px solid #2a3f5f;
    color: #e0e0e0;
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 0.8rem;
    outline: none;
  }
  #chat input:focus { border-color: #00d4ff; }

  /* ---------- Settings panel ---------- */
  #settings {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5,5,10,0.9);
    z-index: 1000;
    pointer-events: auto;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #settings.hidden { display: none !important; }
  .settings-card {
    background: #16213e;
    border: 1px solid #00d4ff;
    border-radius: 14px;
    padding: 32px;
    width: 420px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7);
  }
  .settings-card h2 { color: #00d4ff; margin-bottom: 20px; font-size: 1.3rem; }
  .settings-row {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .settings-row label { color: #c9d1e2; font-size: 0.85rem; font-weight: 600; }
  .settings-row input[type=range] {
    width: 100%; accent-color: #00d4ff;
  }
  .settings-row .val { color: #00d4ff; font-family: 'Consolas', monospace; font-size: 0.8rem; }
  .settings-btns { display: flex; gap: 10px; margin-top: 24px; }
  .settings-btns button { flex: 1; padding: 11px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
  .settings-btns .close { background: #00d4ff; color: #000; }
  .settings-btns .close:hover { background: #33e0ff; }

  /* ---------- Notifications ---------- */
  #notif {
    position: fixed;
    top: 80px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    border: 1px solid #00d4ff;
    border-radius: 8px;
    padding: 10px 20px;
    color: #00d4ff;
    font-weight: 700;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #notif.show { opacity: 1; }

  .hidden { display: none !important; }
  .btn {
    background: #00d4ff;
    border: none;
    color: #000;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { background: #33e0ff; }
</style>
</head>
<body>

<!-- Game stream fills the screen -->
<div id="gameContainer">
  <img id="gameScreen" src="" alt="Game stream">
  <div id="gameConnecting">Establishing game stream…</div>
</div>

<!-- HUD -->
<div class="overlay">
  <div class="hud-top">
    <div class="hud-pill game">
      <span class="indicator" id="indRelay"></span>
      <span class="hud-label">Relay</span>
      <span id="relayText" class="hud-value">connecting…</span>
    </div>
    <div class="hud-pill stream">
      <span class="indicator" id="indGame"></span>
      <span class="hud-label">Game</span>
      <span id="gameText" class="hud-value">not streaming</span>
    </div>
    <div class="hud-pill stream">
      <span class="indicator streaming" id="indStream"></span>
      <span class="hud-label">Stream</span>
      <span id="fpsText" class="hud-value">-- fps</span>
    </div>
  </div>

  <div class="ctrl-hint">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
    <kbd>Space</kbd> <kbd>Enter</kbd> <kbd>Esc</kbd> <kbd>F1</kbd>
    <span style="color:#6a7a98; margin-left:12px; font-size:0.75rem;">Gamepad supported • F1 = settings</span>
  </div>
</div>

<!-- Chat -->
<div id="chat">
  <div class="chat-header">CHAT</div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-wrap">
    <input type="text" id="chatInput" placeholder="Say something…">
  </div>
</div>

<!-- Lobby -->
<div id="lobby">
  <div class="lobby-card">
    <h1>MC3</h1>
    <div class="subtitle">Browser Multiplayer</div>
    <input type="text" id="playerName" value="Player" placeholder="Your name">
    <div class="lobby-actions">
      <button class="lobby-btn primary" id="btnCreate">Create Game</button>
      <button class="lobby-btn secondary" id="btnRefresh">Refresh List</button>
    </div>
    <div class="game-list" id="gameList">
      <div style="color:#6a7a98; font-size:0.8rem; padding:10px;">No games available</div>
    </div>
    <div class="lobby-footer">
      Stream starts when you join a game • Gamepad supported
    </div>
  </div>
</div>

<!-- Settings -->
<div id="settings" class="hidden">
  <div class="settings-card">
    <h2>Stream Settings</h2>
    <div class="settings-row">
      <label>Quality <span id="qVal" class="val">75%</span></label>
      <input type="range" id="qRange" min="10" max="100" value="75">
    </div>
    <div class="settings-row">
      <label>Resolution <span id="sVal" class="val">100%</span></label>
      <input type="range" id="sRange" min="25" max="100" value="100">
    </div>
    <div class="settings-row">
      <label>Target FPS <span id="fVal" class="val">60</span></label>
      <input type="range" id="fRange" min="15" max="120" value="60">
    </div>
    <div class="settings-btns">
      <button class="btn close" id="btnSettingsClose">Close</button>
    </div>
  </div>
</div>

<!-- Notification -->
<div id="notif"></div>

<script>
/* ---------------- Config ---------------- */
const RELAY_URL = (() => {
  const p = new URLSearchParams(window.location.search);
  return p.get('relay') || 'ws://localhost:8080';
})();
const STREAM_URL = (() => {
  const p = new URLSearchParams(window.location.search);
  const host = window.location.hostname;
  return p.get('stream') || `ws://${host}:8766`;
})();

/* ---------------- State ---------------- */
let relayWs = null;
let streamWs = null;
let myId = null;
let myRole = null;
let myColor = null;
let currentGameId = null;
let relayConnected = false;
let streamConnected = false;

let keys = {};
const activeKeys = new Set();
let gamepads = [];
let lastGamepadPoll = 0;
const GAMEPAD_POLL_MS = 16; // ~60 Hz

let lastInputTime = 0;
const INPUT_COOLDOWN_MS = 30;

let lastFrameTs = 0;
let frameCount = 0;
let fpsLastSecond = Date.now();

/* ---------------- Elements ---------------- */
const gameScreen = document.getElementById('gameScreen');
const gameConnecting = document.getElementById('gameConnecting');
const indRelay = document.getElementById('indRelay');
const indGame = document.getElementById('indGame');
const indStream = document.getElementById('indStream');
const relayText = document.getElementById('relayText');
const gameText = document.getElementById('gameText');
const fpsText = document.getElementById('fpsText');
const lobby = document.getElementById('lobby');
const playerName = document.getElementById('playerName');
const btnCreate = document.getElementById('btnCreate');
const btnRefresh = document.getElementById('btnRefresh');
const gameListEl = document.getElementById('gameList');
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');

const settingsEl = document.getElementById('settings');
const qRange = document.getElementById('qRange');
const qVal = document.getElementById('qVal');
const sRange = document.getElementById('sRange');
const sVal = document.getElementById('sVal');
const fRange = document.getElementById('fRange');
const fVal = document.getElementById('fVal');
const btnSettingsClose = document.getElementById('btnSettingsClose');
const notif = document.getElementById('notif');

/* ---------------- Helpers ---------------- */
function setRelay(ok, text) {
  relayConnected = ok;
  indRelay.className = `indicator ${ok ? 'online' : 'offline'}`;
  relayText.textContent = text;
}

function setGame(ok, text) {
  indGame.className = `indicator ${ok ? 'online' : 'offline'}`;
  gameText.textContent = text;
}

function addChat(text, type = 'other') {
  const div = document.createElement('div');
  div.className = `chat-msg ${type}`;
  const ts = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  div.textContent = `[${ts}] ${text}`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function showNotif(text) {
  notif.textContent = text;
  notif.classList.add('show');
  setTimeout(() => notif.classList.remove('show'), 2200);
}

function openLobby(open) {
  if (open) lobby.classList.remove('hidden');
  else lobby.classList.add('hidden');
}

/* ---------------- Relay ---------------- */
function connectRelay() {
  relayWs = new WebSocket(RELAY_URL);
  relayWs.binaryType = 'arraybuffer';

  relayWs.onopen = () => {
    setRelay(true, 'connected');
    addChat('Connected to relay server', 'system');
    btnCreate.disabled = false;
    btnRefresh.disabled = false;
  };

  relayWs.onclose = () => {
    setRelay(false, 'disconnected');
    relayConnected = false;
    btnCreate.disabled = true;
    btnRefresh.disabled = true;
    setTimeout(connectRelay, 3000);
  };

  relayWs.onmessage = (event) => {
    if (typeof event.data === 'string') {
      const msg = JSON.parse(event.data);
      handleRelayMsg(msg);
    }
  };

  relayWs.onerror = () => {
    setRelay(false, 'error');
  };
}

function handleRelayMsg(msg) {
  switch (msg.type) {
    case 'joined':
      myId = msg.id || myId;
      myRole = msg.role;
      myColor = msg.color;
      currentGameId = msg.gameId;
      addChat(`Joined game #${currentGameId} (${myRole})`, 'system');
      openLobby(false);
      connectStream();
      break;
    case 'created':
      myId = msg.id;
      myRole = msg.role;
      myColor = msg.color;
      currentGameId = msg.gameId;
      addChat(`Created game #${currentGameId} as host`, 'system');
      openLobby(false);
      connectStream();
      break;
    case 'gameList':
      renderGames(msg.games);
      break;
    case 'playerJoined':
      addChat(`${msg.name} joined`, 'system');
      break;
    case 'playerLeft':
      addChat(`${msg.name} left`, 'system');
      break;
    case 'chat':
      addChat(`${msg.from}: ${msg.text}`, 'other');
      break;
    case 'error':
      addChat(`Error: ${msg.error}`, 'system');
      break;
  }
}

function renderGames(games) {
  gameListEl.innerHTML = '';
  if (games.length === 0) {
    gameListEl.innerHTML = '<div style="color:#6a7a98; font-size:0.8rem; padding:10px;">No games available</div>';
    return;
  }
  for (const g of games) {
    const item = document.createElement('div');
    item.className = `game-item ${g.playerCount >= g.maxPlayers ? 'full' : ''}`;
    const badges = g.players ? g.players.map(p =>
      `<span class="player-badge" style="background:${p.color || '#888'}">${p.name ? p.name[0] : '?'}</span>`
    ).join('') : '';
    item.innerHTML = `
      <div class="gi-top">
        <div class="game-id">#${g.id}</div>
        <div class="game-info">${g.playerCount}/${g.maxPlayers} players${g.started ? ' • LIVE' : ''}</div>
      </div>
      <div class="players">${badges}</div>
    `;
    if (g.playerCount < g.maxPlayers && !g.started) {
      item.onclick = () => joinGame(g.id);
    }
    gameListEl.appendChild(item);
  }
}

function createGame() {
  const name = playerName.value.trim() || 'Player';
  if (relayWs && relayWs.readyState === WebSocket.OPEN) {
    relayWs.send(JSON.stringify({ type: 'create', name }));
  }
}

function joinGame(gameId) {
  const name = playerName.value.trim() || 'Player';
  if (relayWs && relayWs.readyState === WebSocket.OPEN) {
    relayWs.send(JSON.stringify({ type: 'join', game: gameId, name }));
  }
}

function requestList() {
  if (relayWs && relayWs.readyState === WebSocket.OPEN) {
    relayWs.send(JSON.stringify({ type: 'list' }));
  }
}

/* ---------------- Stream ---------------- */
function connectStream() {
  streamWs = new WebSocket(STREAM_URL);
  streamWs.binaryType = 'arraybuffer';

  streamWs.onopen = () => {
    streamConnected = true;
    indStream.className = 'indicator streaming';
    gameConnecting.style.display = 'none';
    addChat('Game stream connected', 'system');
    streamWs.send(JSON.stringify({
      type: 'join',
      name: playerName.value || 'Player',
    }));
  };

  streamWs.onclose = () => {
    streamConnected = false;
    indStream.className = 'indicator offline';
    gameConnecting.style.display = 'block';
    setGame(false, 'not streaming');
    setTimeout(connectStream, 2000);
  };

  streamWs.onmessage = (event) => {
    if (typeof event.data === 'string') {
      const msg = JSON.parse(event.data);
      if (msg.type === 'hello') {
        console.log('[stream] hello', msg);
        return;
      }
      if (msg.type === 'frame') {
        renderFrame(msg);
        return;
      }
      console.log('[stream]', msg);
    }
  };

  streamWs.onerror = (err) => {
    console.error('[stream] error', err);
  };
}

function renderFrame(msg) {
  const now = Date.now();
  frameCount++;
  if (now - fpsLastSecond >= 1000) {
    fpsText.textContent = `${frameCount} fps`;
    frameCount = 0;
    fpsLastSecond = now;
  }
  gameScreen.src = `data:image/jpeg;base64,${msg.data}`;
  gameConnecting.style.display = 'none';
  setGame(true, 'streaming');
}

/* ---------------- Input ---------------- */
function sendInput(keyCode, pressed) {
  const now = Date.now();
  if (now - lastInputTime < INPUT_COOLDOWN_MS) return;
  lastInputTime = now;
  const buf = new Uint8Array([0x01, keyCode & 0xFF, pressed ? 1 : 0, 0x00]);
  if (streamWs && streamWs.readyState === WebSocket.OPEN) {
    streamWs.send(buf);
  }
}

function onKeyDown(e) {
  if (!lobby.classList.contains('hidden')) return;
  if (e.repeat) return;
  activeKeys.add(e.code);
  switch (e.code) {
    case 'KeyW': sendInput(0x57, 1); break;
    case 'KeyA': sendInput(0x41, 1); break;
    case 'KeyS': sendInput(0x53, 1); break;
    case 'KeyD': sendInput(0x44, 1); break;
    case 'Space': sendInput(0x20, 1); break;
    case 'Enter': sendInput(0x0D, 1); break;
    case 'Escape': openLobby(true); break;
    case 'F1': toggleSettings(); break;
  }
}

function onKeyUp(e) {
  activeKeys.delete(e.code);
  switch (e.code) {
    case 'KeyW': sendInput(0x57, 0); break;
    case 'KeyA': sendInput(0x41, 0); break;
    case 'KeyS': sendInput(0x53, 0); break;
    case 'KeyD': sendInput(0x44, 0); break;
    case 'Space': sendInput(0x20, 0); break;
    case 'Enter': sendInput(0x0D, 0); break;
  }
}

/* Gamepad support */
function pollGamepads() {
  if (!streamConnected || !streamWs || streamWs.readyState !== WebSocket.OPEN) return;
  const now = Date.now();
  if (now - lastGamepadPoll < GAMEPAD_POLL_MS) return;
  lastGamepadPoll = now;

  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (let i = 0; i < pads.length; i++) {
    const gp = pads[i];
    if (!gp) continue;
    // Buttons
    for (let j = 0; j < gp.buttons.length; j++) {
      const b = gp.buttons[j];
      const pressed = b.pressed;
      const key = `gp${i}b${j}`;
      if (pressed && !activeKeys.has(key)) {
        activeKeys.add(key);
        sendGamepadButton(j, 1);
      } else if (!pressed && activeKeys.has(key)) {
        activeKeys.delete(key);
        sendGamepadButton(j, 0);
      }
    }
    // Axes (left stick for steer)
    const lx = gp.axes[0] || 0;
    const ly = gp.axes[1] || 0;
    const deadzone = 0.15;
    // Map axes to digital for now (simpler for the proxy)
    if (lx < -deadzone) sendGamepadAxis(0, 1);
    else if (lx > deadzone) sendGamepadAxis(1, 1);
    else { sendGamepadAxis(0, 0); sendGamepadAxis(1, 0); }
    if (ly < -deadzone) sendGamepadAxis(2, 1);
    else if (ly > deadzone) sendGamepadAxis(3, 1);
    else { sendGamepadAxis(2, 0); sendGamepadAxis(3, 0); }
  }
}

function sendGamepadButton(idx, pressed) {
  // 0x02 = gamepad button packet: [0x02, buttonIndex, pressed, 0]
  const buf = new Uint8Array([0x02, idx & 0xFF, pressed ? 1 : 0, 0x00]);
  if (streamWs && streamWs.readyState === WebSocket.OPEN) streamWs.send(buf);
}

function sendGamepadAxis(axis, pressed) {
  // 0x03 = gamepad axis packet: [0x03, axisIndex, pressed, 0]
  const buf = new Uint8Array([0x03, axis & 0xFF, pressed ? 1 : 0, 0x00]);
  if (streamWs && streamWs.readyState === WebSocket.OPEN) streamWs.send(buf);
}

function gamepadLoop() {
  pollGamepads();
  requestAnimationFrame(gamepadLoop);
}

/* ---------------- Chat ---------------- */
function addChat(text, type = 'other') {
  const div = document.createElement('div');
  div.className = `chat-msg ${type}`;
  const ts = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  div.textContent = `[${ts}] ${text}`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function sendChat() {
  const text = chatInput.value.trim();
  if (!text || !relayWs || relayWs.readyState !== WebSocket.OPEN) return;
  relayWs.send(JSON.stringify({ type: 'chat', text }));
  chatInput.value = '';
}

/* ---------------- Settings ---------------- */
function toggleSettings() {
  const hidden = settingsEl.classList.contains('hidden');
  if (hidden) settingsEl.classList.remove('hidden');
  else settingsEl.classList.add('hidden');
}

qRange.oninput = (e) => {
  qVal.textContent = `${e.target.value}%`;
  if (streamWs && streamWs.readyState === WebSocket.OPEN) {
    streamWs.send(JSON.stringify({ type: 'settings', quality: parseInt(e.target.value) }));
  }
};
sRange.oninput = (e) => {
  sVal.textContent = `${e.target.value}%`;
  if (streamWs && streamWs.readyState === WebSocket.OPEN) {
    streamWs.send(JSON.stringify({ type: 'settings', scale: parseInt(e.target.value) / 100 }));
  }
};
fRange.oninput = (e) => {
  fVal.textContent = e.target.value;
  if (streamWs && streamWs.readyState === WebSocket.OPEN) {
    streamWs.send(JSON.stringify({ type: 'settings', fps: parseInt(e.target.value) }));
  }
};
btnSettingsClose.onclick = () => settingsEl.classList.add('hidden');

/* ---------------- Init ---------------- */
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);

btnCreate.onclick = createGame;
btnRefresh.onclick = requestList;

chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendChat(); };

// Start everything
connectRelay();
requestList();
requestAnimationFrame(gamepadLoop);

</script>
</html>
